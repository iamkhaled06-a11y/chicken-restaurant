<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إحصائيات شيكن</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f7;font-family:Tahoma,Arial,sans-serif;color:#171717}.wrap{width:min(1150px,94%);margin:30px auto}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:25px}.head h1{margin:0}.btn{background:#e63922;color:#fff;border:0;padding:12px 20px;border-radius:12px;font-weight:900;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 8px 30px #0001}.label{color:#777;font-weight:700}.num{font-size:38px;font-weight:900;margin-top:10px;color:#e63922}.live{color:#168a45}.section{margin-top:22px}.bar{height:14px;background:#eee;border-radius:20px;overflow:hidden;margin-top:12px}.bar span{display:block;height:100%;background:#e63922;border-radius:20px;width:0}.muted{color:#777}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="head"><h1>📊 إحصائيات شيكن</h1><div><button class="btn" onclick="load()">تحديث</button> <a class="btn" href="/admin" style="text-decoration:none">الطلبات</a></div></div><div class="grid"><div class="card"><div class="label">👥 إجمالي الزوار</div><div id="total" class="num">—</div></div><div class="card"><div class="label">🟢 المتصفحون الآن</div><div id="online" class="num live">—</div></div><div class="card"><div class="label">📄 مشاهدات الصفحات</div><div id="views" class="num">—</div></div><div class="card"><div class="label">📋 عدد الطلبات</div><div id="orders" class="num">—</div></div></div><div class="card section"><h2>نشاط الزوار</h2><p class="muted">عدد المتصفحين المتصلين يتحدث تلقائيًا كل 15 ثانية.</p><div class="bar"><span id="bar"></span></div><p id="updated" class="muted"></p></div></div><script>let pass=localStorage.getItem('chicken_admin_password')||'';async function login(){pass=prompt('أدخل كلمة مرور الإدارة');if(pass){localStorage.setItem('chicken_admin_password',pass);load()}}async function load(){if(!pass)return login();const r=await fetch('/api/stats',{headers:{'X-Admin-Password':pass}});if(r.status===401){pass='';localStorage.removeItem('chicken_admin_password');return login()}const d=await r.json();document.getElementById('total').textContent=d.uniqueVisitors;document.getElementById('online').textContent=d.online;document.getElementById('views').textContent=d.pageViews;document.getElementById('orders').textContent=d.orders;document.getElementById('bar').style.width=Math.min(100,d.online*10)+'%';document.getElementById('updated').textContent='آخر تحديث: '+new Date().toLocaleTimeString('ar-LB')}load();setInterval(load,15000);</script></body></html>
