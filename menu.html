<main class="content"><div class="wrap">
<div class="hero"><h1>🍗 منيو <span>شيكن</span></h1><p>اختار وجبتك المفضلة — اضغط على أي صنف لتحديد الكمية والطلب ❤️</p></div>

<div id="order" class="orderbox"><h2>🛒 اطلب الآن</h2><form id="orderForm"><input name="name" required placeholder="الاسم"><input name="phone" required type="tel" placeholder="رقم الهاتف"><input name="address" required placeholder="العنوان"><select name="item" required><option value="">اختر الوجبة</option></select><input name="qty" required type="number" min="1" value="1" placeholder="الكمية"><textarea name="notes" rows="3" placeholder="ملاحظات إضافية"></textarea><button class="btn" type="submit">إرسال الطلب</button><p id="msg"></p></form></div></div></main>

<script>
let selectedItem='',selectedData={},modalQty=1;
const itemData={};
document.querySelectorAll('.card').forEach(card=>{
 const title=card.querySelector('h3')?.textContent.trim(); if(!title)return;
 const price=card.querySelector('.price')?.textContent.trim()||'';
 const img=card.querySelector('img')?.src||'';
 itemData[title]={price,img};
 card.addEventListener('click',()=>openOrder(title));
 const opt=document.createElement('option');opt.textContent=title+' — '+price;opt.value=title+' — '+price;document.querySelector('select[name="item"]').appendChild(opt);
});
function openOrder(title){selectedItem=title;selectedData=itemData[title]||{};modalQty=1;document.getElementById('modalImg').src=selectedData.img||'';document.getElementById('modalImg').alt=title;document.getElementById('modalTitle').textContent=title;document.getElementById('modalPrice').textContent=selectedData.price||'';document.getElementById('modalQty').textContent=1;const modal=document.getElementById('orderModal');modal.classList.add('show');modal.setAttribute('aria-hidden','false')}
function closeOrder(){const modal=document.getElementById('orderModal');modal.classList.remove('show');modal.setAttribute('aria-hidden','true')}
function changeQty(delta){modalQty=Math.max(1,modalQty+delta);document.getElementById('modalQty').textContent=modalQty}
function addSelectedOrder(){const select=document.querySelector('select[name="item"]');select.value=selectedItem+' — '+(selectedData.price||'');document.querySelector('input[name="qty"]').value=modalQty;closeOrder();document.getElementById('order').scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>document.querySelector('input[name="name"]').focus(),450)}
document.getElementById('orderModal').addEventListener('click',e=>{if(e.target.id==='orderModal')closeOrder()});
const API='https://chicken-orders-api.onrender.com';
document.getElementById('orderForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.target,m=document.getElementById('msg');m.textContent='جاري إرسال الطلب...';try{const r=await fetch(API+'/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});const d=await r.json();if(!r.ok)throw new Error(d.error||'error');m.innerHTML='تم استلام طلبك بنجاح ❤️<br><a href="'+d.ratingUrl+'" target="_blank" style="display:inline-block;margin-top:10px;color:#e63922;font-weight:900">⭐ عند وصول الطلب اضغط هنا لتأكيد الاستلام وتقييم الطلب</a>';f.reset()}catch(x){m.textContent='تعذر إرسال الطلب حاليًا، اتصل بنا على 71 874 489.'}});
</script>
<script>(function(){const k='chicken_visitor_id';let id=localStorage.getItem(k);if(!id){id=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();localStorage.setItem(k,id)}const send=()=>fetch('https://chicken-orders-api.onrender.com/api/visit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,page:location.pathname})}).catch(()=>{});send();setInterval(send,15000)})();</script>
