<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقييم طلبك | شيكن</title><style>body{margin:0;background:#fff8ef;font-family:Tahoma,Arial,sans-serif;color:#171717}.box{max-width:520px;margin:60px auto;padding:30px;background:#fff;border-radius:26px;box-shadow:0 15px 45px #0001;text-align:center}.logo{font-size:32px;font-weight:900;color:#e63922}.stars{display:flex;justify-content:center;gap:8px;direction:ltr;margin:22px 0}.star{border:0;background:#f2f2f2;border-radius:14px;width:55px;height:55px;font-size:30px;cursor:pointer}.star.active{background:#ffc21c}.choice{display:block;width:100%;padding:15px;border:0;border-radius:13px;background:#168a45;color:#fff;font-weight:900;font-size:17px;cursor:pointer;margin:14px 0}.textarea{width:100%;min-height:100px;border:1px solid #ddd;border-radius:13px;padding:12px;font:inherit;box-sizing:border-box}.muted{color:#777}.ok{color:#168a45;font-weight:900;font-size:20px}</style></head><body><div class="box"><div class="logo">🍗 شيكن</div><h1>هل وصلك طلبك؟</h1><p id="orderText" class="muted">جاري تحميل الطلب...</p><button class="choice" onclick="delivered()">✅ نعم، وصل الطلب</button><h2>⭐ قيّم تجربتك</h2><div class="stars"><button class="star" data-v="1">★</button><button class="star" data-v="2">★</button><button class="star" data-v="3">★</button><button class="star" data-v="4">★</button><button class="star" data-v="5">★</button></div><textarea id="comment" class="textarea" placeholder="ملاحظتك (اختياري)"></textarea><button class="choice" onclick="rate()">إرسال التقييم</button><p id="msg"></p></div><script>const id=new URLSearchParams(location.search).get('id');let rating=0;document.querySelectorAll('.star').forEach(s=>s.onclick=()=>{rating=Number(s.dataset.v);document.querySelectorAll('.star').forEach(x=>x.classList.toggle('active',Number(x.dataset.v)<=rating))});async function delivered(){if(!id)return;const r=await fetch('/api/orders/'+encodeURIComponent(id)+'/delivered',{method:'POST'});document.getElementById('msg').textContent=r.ok?'تم تسجيل أن الطلب وصل ❤️':'تعذر تسجيل العملية';}async function rate(){if(!id||!rating){document.getElementById('msg').textContent='اختر عدد النجوم أولاً ⭐';return}const r=await fetch('/api/orders/'+encodeURIComponent(id)+'/rating',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rating,comment:document.getElementById('comment').value})});document.getElementById('msg').className=r.ok?'ok':'';document.getElementById('msg').textContent=r.ok?'شكراً لتقييمك ❤️ تم تسجيل العملية بنجاح':'تعذر إرسال التقييم حالياً';}async function load(){if(!id){document.getElementById('orderText').textContent='رابط التقييم غير صحيح';return}const r=await fetch('/api/orders/'+encodeURIComponent(id)+'/public');if(r.ok){const o=await r.json();document.getElementById('orderText').textContent='طلب '+o.item+' × '+o.qty+' — شكراً لاختيارك شيكن ❤️'}}load();</script></body></html>
