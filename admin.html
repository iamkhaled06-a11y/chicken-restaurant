<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبات شيكن</title><style>body{margin:0;background:#fff8ef;font-family:Tahoma,Arial,sans-serif;color:#171717}.wrap{width:min(1100px,92%);margin:35px auto}.box{background:#fff;padding:28px;border-radius:22px;box-shadow:0 10px 35px #0001}.login{max-width:420px;margin:90px auto}.login input,.login button{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:1px solid #ddd;font:inherit}.btn{background:#e63922;color:#fff;border:0;cursor:pointer;font-weight:900}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.order{border:1px solid #eee;border-radius:16px;padding:18px;margin:14px 0}.new{border-right:5px solid #e63922}.muted{color:#777}.status{padding:6px 10px;border-radius:20px;background:#ffc21c;font-weight:900}</style></head><body><div class="wrap"><div id="login" class="box login"><h1>🔐 طلبات شيكن</h1><p>هذه الصفحة خاصة بصاحب المطعم.</p><input id="pass" type="password" placeholder="كلمة المرور"><button class="btn" onclick="load()">دخول</button><p id="err"></p></div><div id="app" class="box" style="display:none"><div class="top"><h1>📋 طلبات الزبائن</h1><button class="btn" onclick="loadOrders()">تحديث الطلبات</button></div><div id="list"></div></div></div><script>let password='';async function load(){password=document.getElementById('pass').value;const r=await fetch('/api/orders',{headers:{'X-Admin-Password':password}});if(!r.ok){document.getElementById('err').textContent='كلمة المرور غير صحيحة';return}document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';render(await r.json())}async function loadOrders(){const r=await fetch('/api/orders',{headers:{'X-Admin-Password':password}});render(await r.json())}function render(xs){const el=document.getElementById('list');el.innerHTML=xs.length?xs.map(o=>'<div class="order '+(o.status==='جديد'?'new':'')+'"><div><span class="status">'+o.status+'</span> <b>#'+o.id+'</b></div><p><b>الاسم:</b> '+esc(o.name)+'<br><b>الهاتف:</b> <a href="tel:'+esc(o.phone)+'">'+esc(o.phone)+'</a><br><b>العنوان:</b> '+esc(o.address)+'<br><b>الطلب:</b> '+esc(o.item)+' × '+esc(o.qty)+(o.notes?'<br><b>ملاحظات:</b> '+esc(o.notes):'')+'<br><span class="muted">'+new Date(o.createdAt).toLocaleString('ar-LB')+'</span></p></div>').join(''):'<p>لا توجد طلبات بعد.</p>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
