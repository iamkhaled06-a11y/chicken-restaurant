<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة تحكم شيكن</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f9;font-family:Tahoma,Arial,sans-serif;color:#171717}.wrap{width:min(1200px,94%);margin:28px auto}.box{background:#fff;padding:26px;border-radius:24px;box-shadow:0 10px 35px #0001}.login{max-width:430px;margin:90px auto}.login input,.login button{width:100%;padding:15px;margin:8px 0;border-radius:12px;border:1px solid #ddd;font:inherit}.btn{background:#e63922;color:#fff;border:0;cursor:pointer;font-weight:900}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.actions{display:flex;gap:10px;flex-wrap:wrap}.link{display:inline-block;text-decoration:none;padding:11px 16px;border-radius:11px;background:#171717;color:#fff;font-weight:900}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:22px 0}.stat{padding:20px;border-radius:18px;background:#fff4ec;border:1px solid #ffe1a3}.stat b{display:block;font-size:30px;color:#e63922;margin-top:7px}.filters{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}.filters input,.filters select{padding:12px;border:1px solid #ddd;border-radius:11px;font:inherit}.order{background:#fff;border:1px solid #eee;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 5px 18px #0000000a}.new{border-right:6px solid #e63922}.done{border-right:6px solid #168a45}.delivered{border-right:6px solid #168a45}.status{display:inline-block;padding:6px 11px;border-radius:20px;background:#ffc21c;font-weight:900}.status.done{background:#dff7e8;color:#168a45}.status.delivered{background:#e4f1ff;color:#1769aa}.muted{color:#777}.order-top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.order h3{margin:10px 0}.phone{color:#168a45;font-weight:900}.order-actions{display:flex;gap:8px;flex-wrap:wrap}.small{padding:9px 12px;border:0;border-radius:9px;cursor:pointer;font-weight:900;text-decoration:none}.green{background:#dff7e8;color:#168a45}.blue{background:#e4f1ff;color:#1769aa}.gray{background:#eee;color:#333}.rating{margin-top:12px;padding:10px 14px;background:#fff8df;border-radius:12px}.empty{text-align:center;padding:45px;color:#777}.new-alert{display:none;background:#dff7e8;color:#168a45;border:2px solid #8ed6aa;border-radius:16px;padding:15px 18px;margin:18px 0;font-weight:900;font-size:17px;text-align:center;cursor:pointer}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.wrap{width:94%}}</style></head><body><div class="wrap"><div id="login" class="box login"><h1>🔐 لوحة تحكم شيكن</h1><p>إدارة الطلبات والإحصائيات</p><input id="pass" type="password" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter')load()"><button class="btn" onclick="load()">دخول إلى لوحة التحكم</button><p id="err"></p></div><div id="app" style="display:none"><div class="box"><div class="head"><div><h1>🍗 لوحة تحكم شيكن</h1><p class="muted">إدارة طلبات الزبائن ومتابعة التوصيل والتقييمات</p></div><div class="actions"><a class="link" href="/stats">📊 الإحصائيات</a><button class="btn" onclick="loadOrders()">🔄 تحديث</button></div></div><div class="stats"><div class="stat">📋 إجمالي الطلبات<b id="total">0</b></div><div class="stat">🆕 الجديدة<b id="new">0</b></div><div class="stat">🚚 تم التوصيل<b id="delivered">0</b></div><div class="stat">⭐ متوسط التقييم<b id="rating">—</b></div></div><div class="filters"><input id="search" placeholder="🔎 ابحث بالاسم أو الهاتف أو الوجبة" oninput="render()"><select id="filter" onchange="render()"><option value="all">كل الطلبات</option><option value="جديد">جديد</option><option value="قيد التحضير">قيد التحضير</option><option value="تم التوصيل">تم التوصيل</option><option value="مكتمل">مكتمل / قديم</option></select></div><div id="newAlert" class="new-alert" onclick="loadOrders()">🔔 طلب جديد وصل! اضغط لتحديث الطلبات</div><div id="list"></div></div></div></div><script>let password=localStorage.getItem('chicken_admin_password')||'',orders=[],lastOrderIds=new Set(),firstLoad=true;function showNewAlert(){const a=document.getElementById('newAlert');a.style.display='block';try{const x=new (window.AudioContext||window.webkitAudioContext)(),o=x.createOscillator(),g=x.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(x.destination);o.start();o.stop(x.currentTime+.25)}catch(e){}}async function load(){if(!password)password=document.getElementById('pass').value.trim();if(!password)return;const r=await fetch('/api/orders',{headers:{'X-Admin-Password':password}});if(!r.ok){password='';localStorage.removeItem('chicken_admin_password');document.getElementById('err').textContent='كلمة المرور غير صحيحة';return}localStorage.setItem('chicken_admin_password',password);document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';const fresh=await r.json();if(!firstLoad&&fresh.some(o=>o.status==='جديد'&&!lastOrderIds.has(o.id)))showNewAlert();orders=fresh;lastOrderIds=new Set(orders.map(o=>o.id));firstLoad=false;render()}async function loadOrders(){const r=await fetch('/api/orders',{headers:{'X-Admin-Password':password}});if(r.ok){const fresh=await r.json();orders=fresh;lastOrderIds=new Set(orders.map(o=>o.id));document.getElementById('newAlert').style.display='none';render()}}async function setStatus(id,status){const r=await fetch('/api/orders/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Password':password},body:JSON.stringify({status})});if(r.ok)loadOrders()}function ratingStats(){const rs=orders.filter(o=>o.rating).map(o=>Number(o.rating));return rs.length?(rs.reduce((a,b)=>a+b,0)/rs.length).toFixed(1):'—'}function render(){const q=(document.getElementById('search')?.value||'').toLowerCase(),f=document.getElementById('filter')?.value||'all';document.getElementById('total').textContent=orders.length;document.getElementById('new').textContent=orders.filter(o=>o.status==='جديد').length;document.getElementById('delivered').textContent=orders.filter(o=>o.status==='تم التوصيل'||o.status==='مكتمل').length;document.getElementById('rating').textContent=ratingStats();const xs=orders.filter(o=>o.status!=='مكتمل'&&(f==='all'||o.status===f)&&[o.name,o.phone,o.item,o.address].join(' ').toLowerCase().includes(q));document.getElementById('list').innerHTML=xs.length?xs.map(o=>{const done=o.status==='مكتمل',del=o.status==='تم التوصيل';return '<div class="order '+(done?'done':del?'delivered':'new')+'"><div class="order-top"><span class="status '+(done?'done':del?'delivered':'')+'">'+esc(o.status)+'</span><span class="muted">#'+esc(o.id)+'</span></div><h3>👤 '+esc(o.name)+'</h3><p>📞 <a class="phone" href="tel:'+esc(o.phone)+'">'+esc(o.phone)+'</a><br>📍 '+esc(o.address)+'<br>🍗 <b>'+esc(o.item)+'</b> × '+esc(o.qty)+(o.notes?'<br>📝 '+esc(o.notes):'')+'</p><p class="muted">'+new Date(o.createdAt).toLocaleString('ar-LB')+'</p>'+(o.rating?'<div class="rating">⭐ تقييم الزبون: <b>'+o.rating+'/5</b>'+(o.ratingComment?' — '+esc(o.ratingComment):'')+'</div>':'')+'<div class="order-actions"><a class="small green" href="tel:'+esc(o.phone)+'">اتصال</a><button class="small gray" onclick="setStatus('+JSON.stringify(o.id)+','+JSON.stringify('قيد التحضير')+')">قيد التحضير</button><button class="small blue" onclick="setStatus('+JSON.stringify(o.id)+','+JSON.stringify('تم التوصيل')+')">🚚 تم التوصيل</button><button class="small green" onclick="setStatus('+JSON.stringify(o.id)+','+JSON.stringify('مكتمل')+')">مكتمل</button></div></div>'}).join(''):'<div class="empty">لا توجد طلبات مطابقة 🔍</div>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();setInterval(load,15000);</script></body></html>
