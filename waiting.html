conds<=0){clearInterval(t);timer.textContent='00:00';done.style.display='block';rate.style.display='inline-block'}else seconds--}const t=setInterval(tick,1000);tick();if(id){order.textContent='رقم الطلب: '+id;rate.href='https://chicken-orders-api.onrender.com/rate?id='+encodeURIComponent(id);fetch('https://chicken-orders-api.onrender.com/api/orders/'+encodeURIComponent(id)+'/public').then(r=>r.json()).then(o=>{if(o.item)order.textContent='طلب: '+o.item+' — الكمية: '+o.qty}).catch(()=>{})}</script></body></html>
