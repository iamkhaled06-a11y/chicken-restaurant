<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>انتظار الطلب | شيكن</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#fff8ef,#ffe8d9);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#171717}.box{width:min(520px,92%);background:#fff;border-radius:30px;padding:38px 28px;text-align:center;box-shadow:0 20px 60px #0002}.logo{font-size:30px;font-weight:900;color:#e63922}.icon{font-size:70px;margin:15px 0}.box h1{font-size:30px;margin:5px 0 10px}.sub{color:#666;line-height:1.8}.timer{font-size:64px;font-weight:900;color:#e63922;letter-spacing:3px;margin:22px 0}.label{font-weight:800;color:#777}.timebox{background:#fff8ef;border-radius:16px;padding:14px;margin:18px 0;font-weight:800;line-height:2}.order{background:#fff8ef;border-radius:16px;padding:14px;margin:20px 0;font-weight:800}.btn{display:inline-block;background:#e63922;color:#fff;text-decoration:none;border:0;padding:14px 28px;border-radius:30px;font-weight:900;font-size:16px;cursor:pointer;margin-top:5px}.msg{display:none;color:#198754;font-weight:900;margin-top:15px}.small{font-size:13px;color:#999;margin-top:20px}</style></head><body><main class="box"><div class="logo">🍗 شيكن</div><div class="icon">🛵</div><h1>تم استلام طلبك ❤️</h1><p class="sub">طلبك صار قيد الانتظار، حضّر حالك!</p><div class="timebox"><div class="label">🗓️ تاريخ الطلب</div><div id="date">جاري التحميل...</div><div class="label">🕐 وقت الطلب</div><div id="orderTime">جاري التحميل...</div></div><div class="label">⏱️ مدة الانتظار</div><div id="timer" class="timer">00:00:00</div><div id="order" class="order">رقم الطلب: جاري التحميل...</div><button id="delivered" class="btn">✅ وصل الطلب</button><div id="msg" class="msg">تم تسجيل وصول الطلب ❤️</div><p class="small">شيكن — الدليفري مجانًا 🛵</p></main><script>const id=new URLSearchParams(location.search).get('id');const delivered=document.getElementById('delivered'),msg=document.getElementById('msg');delivered.onclick=async()=>{if(!id)return;delivered.disabled=true;try{const r=await fetch('https://chicken-orders-api.onrender.com/api/orders/'+encodeURIComponent(id)+'/delivered',{method:'POST'});if(!r.ok)throw new Error();delivered.style.display='none';msg.style.display='block';clearInterval(window.waitTimer);setTimeout(()=>{location.href='index.html'},700)}catch(e){delivered.disabled=false;alert('تعذر تسجيل وصول الطلب، حاول مرة ثانية')}};const timer=document.getElementById('timer'),order=document.getElementById('order'),dateEl=document.getElementById('date'),timeEl=document.getElementById('orderTime');let createdAt=null;function fmt(n){return String(n).padStart(2,'0')}function updateTimer(){if(!createdAt)return;const elapsed=Math.max(0,Date.now()-createdAt);const total=Math.floor(elapsed/1000),h=Math.floor(total/3600),m=Math.floor(total%3600/60),s=total%60;timer.textContent=fmt(h)+':'+fmt(m)+':'+fmt(s)}function showDateTime(value){const d=new Date(value);if(Number.isNaN(d.getTime()))return;dateEl.textContent=d.toLocaleDateString('ar-LB',{year:'numeric',month:'long',day:'numeric'});timeEl.textContent=d.toLocaleTimeString('ar-LB',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}if(id){order.textContent='رقم الطلب: '+id;fetch('https://chicken-orders-api.onrender.com/api/orders/'+encodeURIComponent(id)+'/public').then(r=>r.json()).then(o=>{if(o.item)order.textContent='طلب: '+o.item+' — الكمية: '+o.qty;if(o.createdAt){createdAt=new Date(o.createdAt).getTime();showDateTime(o.createdAt);updateTimer()}}).catch(()=>{})}window.waitTimer=setInterval(updateTimer,1000);</script></body></html>
